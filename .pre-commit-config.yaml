# =============================================================================
# Paper Trading Simulator — pre-commit hooks
# Same checks CI runs, but locally and before the commit is even created.
#
#   pip install -r backend/requirements/dev.txt
#   pre-commit install
#
# Bypass for a deliberate one-off:  git commit --no-verify
# =============================================================================
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [backend/]
      - id: ruff-format
        args: [backend/]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-r, backend/, -c, pyproject.toml, -x, backend/venv,backend/tests, -q]
        additional_dependencies: ["bandit[toml]==1.9.4"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets-hook
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
              \.secrets\.baseline|
              .*\.docx
          )$
